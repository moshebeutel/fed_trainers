parameters:
  batch_size:
    values: [64, 128, 256]
  clip:
    distribution: log_uniform_values
    max: 1.0
    min: 1e-4
  lr:
    distribution: log_uniform_values
    max: 1e-1
    min: 1e-4
  lr_dec_rate:
    distribution: uniform
    max: 1.0
    min: 0.9
  global_lr:
    distribution: uniform
    max: 1.0
    min: 0.1
  wd:
    distribution: uniform
    max: 0.001
    min: 0.0001

