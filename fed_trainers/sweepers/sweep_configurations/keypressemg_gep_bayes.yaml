parameters:
  batch_size:
    values: [16, 32, 64, 128]
  n_epochs:
    distribution: int_uniform
    max: 15
    min: 2
  clip:
    distribution: log_uniform_values
    max: 1.0
    min: 1e-2
  lr:
    distribution: log_uniform_values
    max: 1e-1
    min: 1e-4
  lr_dec_rate:
    distribution: uniform
    max: 1.0
    min: 0.9
  global_lr:
    distribution: uniform
    max: 1.0
    min: 0.2
  wd:
    distribution: uniform
    max: 0.001
    min: 0.0005
  gradients_history_size:
    distribution: int_uniform
    max: 500
    min: 300
  basis_size:
    distribution: int_uniform
    max: 100
    min: 10

